<!-- pages/bpa.html -->
<div id="bpaContainer" class="operations-container">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
        <img src="assets/images/banner-bpa.png" alt="BPA" style="height:40px;border-radius:8px;" onerror="this.style.display='none'">
        <div>
            <div style="font-weight:700;font-size:18px;color:#1a3a2a;">BPA</div>
            <div style="font-size:12px;color:#5a7a6a;">Código: 01 • PIN: 4 dígitos</div>
        </div>
    </div>
    
    <div class="search-container" style="display:block;padding:0 0 12px 0;">
        <input type="text" class="search-box" id="searchBoxBPA" placeholder="🔍 Buscar operación..." oninput="window.filtrarBPA()">
    </div>
    
    <div class="categories" style="display:flex;margin-bottom:12px;">
        <button class="category-btn active" data-categoria="todas" onclick="window.filtrarBPACategoria('todas', this)">🏠 Inicio</button>
        <button class="category-btn" data-categoria="sesion" onclick="window.filtrarBPACategoria('sesion', this)">🔐 Sesión</button>
        <button class="category-btn" data-categoria="consultas" onclick="window.filtrarBPACategoria('consultas', this)">📊 Consultas</button>
        <button class="category-btn" data-categoria="operaciones" onclick="window.filtrarBPACategoria('operaciones', this)">💸 Operaciones</button>
        <button class="category-btn" data-categoria="configuracion" onclick="window.filtrarBPACategoria('configuracion', this)">⚙️ Config.</button>
    </div>
    
    <div id="bpaList" class="operations-list" style="display:flex;"></div>
</div>

<script>
    function initBPA() {
        renderBPA();
    }
    window.initBPA = initBPA;
</script>
