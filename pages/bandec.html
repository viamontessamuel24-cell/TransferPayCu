<!-- pages/bandec.html -->
<div id="bandecContainer" class="operations-container">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
        <img src="assets/images/bandec-barra.png" alt="BANDEC" style="height:40px;border-radius:8px;" onerror="this.style.display='none'">
        <div>
            <div style="font-weight:700;font-size:18px;color:#1a3a2a;">BANDEC</div>
            <div style="font-size:12px;color:#5a7a6a;">Código: 02 • PIN: 5 dígitos</div>
        </div>
    </div>
    
    <div class="search-container" style="display:block;padding:0 0 12px 0;">
        <input type="text" class="search-box" id="searchBoxBANDEC" placeholder="🔍 Buscar operación..." oninput="window.filtrarBANDEC()">
    </div>
    
    <div class="categories" style="display:flex;margin-bottom:12px;">
        <button class="category-btn active" data-categoria="todas" onclick="window.filtrarBANDECCategoria('todas', this)">🏠 Inicio</button>
        <button class="category-btn" data-categoria="sesion" onclick="window.filtrarBANDECCategoria('sesion', this)">🔐 Sesión</button>
        <button class="category-btn" data-categoria="consultas" onclick="window.filtrarBANDECCategoria('consultas', this)">📊 Consultas</button>
        <button class="category-btn" data-categoria="operaciones" onclick="window.filtrarBANDECCategoria('operaciones', this)">💸 Operaciones</button>
        <button class="category-btn" data-categoria="configuracion" onclick="window.filtrarBANDECCategoria('configuracion', this)">⚙️ Config.</button>
    </div>
    
    <div id="bandecList" class="operations-list" style="display:flex;"></div>
</div>

<script>
    function initBANDEC() {
        renderBANDEC();
    }
    window.initBANDEC = initBANDEC;
</script>
