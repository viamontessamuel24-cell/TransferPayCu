<!-- pages/banmet.html -->
<div id="banmetContainer" class="operations-container">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
        <img src="assets/images/banmet-barra.png" alt="BANMET" style="height:40px;border-radius:8px;" onerror="this.style.display='none'">
        <div>
            <div style="font-weight:700;font-size:18px;color:#1a3a2a;">BANMET</div>
            <div style="font-size:12px;color:#5a7a6a;">Código: 03</div>
        </div>
    </div>
    
    <div class="search-container" style="display:block;padding:0 0 12px 0;">
        <input type="text" class="search-box" id="searchBoxBANMET" placeholder="🔍 Buscar operación..." oninput="window.filtrarBANMET()">
    </div>
    
    <div class="categories" style="display:flex;margin-bottom:12px;">
        <button class="category-btn active" data-categoria="todas" onclick="window.filtrarBANMETCategoria('todas', this)">🏠 Inicio</button>
        <button class="category-btn" data-categoria="sesion" onclick="window.filtrarBANMETCategoria('sesion', this)">🔐 Sesión</button>
        <button class="category-btn" data-categoria="consultas" onclick="window.filtrarBANMETCategoria('consultas', this)">📊 Consultas</button>
        <button class="category-btn" data-categoria="operaciones" onclick="window.filtrarBANMETCategoria('operaciones', this)">💸 Operaciones</button>
        <button class="category-btn" data-categoria="configuracion" onclick="window.filtrarBANMETCategoria('configuracion', this)">⚙️ Config.</button>
    </div>
    
    <div id="banmetList" class="operations-list" style="display:flex;"></div>
</div>

<script>
    function initBANMET() {
        renderBANMET();
    }
    window.initBANMET = initBANMET;
</script>
